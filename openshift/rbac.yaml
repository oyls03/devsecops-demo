apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsecops-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devsecops-demo
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devsecops-demo
subjects:
  - kind: ServiceAccount
    name: devsecops-demo
roleRef:
  kind: Role
  name: devsecops-demo
  apiGroup: rbac.authorization.k8s.io